<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风险挖掘系统</title>
    <link rel="stylesheet" href="src/styles/common.css">
    <link rel="stylesheet" href="src/styles/finance.css">
    <link rel="stylesheet" href="src/styles/zt.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <!-- 头部 -->
    <div class="header">
        <h1>◈ 风险挖掘系统</h1>
        <p>MARKET RISK ANALYSIS PLATFORM</p>
        <div class="nav-tabs">
            <div class="nav-tab" data-feature="macro" onclick="switchFeature('macro')">◈ 宏观日历</div>
            <div class="nav-tab" data-feature="finance" onclick="switchFeature('finance')">◈ 财报风险</div>
            <div class="nav-tab active" data-feature="hot" onclick="switchFeature('hot')">◈ 风险挖掘</div>
        </div>
    </div>

    <!-- 主体内容 -->
    <div class="container cyber-grid">

        <!-- ===== 宏观日历 ===== -->
        <div class="feature-section" id="feature-macro" style="display:none;">
            <div class="panel">
                <div class="panel-title">◈ 宏观事件日历</div>
                <div id="macroCalendar"></div>
            </div>
        </div>

        <!-- ===== 财报风险 ===== -->
        <div class="feature-section" id="feature-finance" style="display:none;">
            <div class="search-box">
                <input type="text" id="symbolInput" placeholder="输入股票代码或名称，如 000001" onkeypress="if(event.key==='Enter')quickSearch()">
                <button onclick="quickSearch()">◈ 分析</button>
            </div>
            <div id="finance-content" style="display:none;">
                <!-- 股票信息 -->
                <div class="panel" id="stockInfo" style="display:none;">
                    <div class="panel-title" id="stockTitle">◈ 基本信息</div>
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;" id="stockBasicInfo"></div>
                </div>

                <!-- 报告期选择 -->
                <div class="report-select" id="reportSelect" style="display:none;">
                    <select id="reportPeriodSelect" onchange="onReportChange()">
                        <option value="">选择报告期</option>
                    </select>
                </div>

                <!-- 图表区 -->
                <div id="financeCharts"></div>

                <!-- 财务表格 -->
                <div class="data-table panel" id="financeTable" style="display:none;">
                    <div class="panel-title">◈ 详细数据</div>
                    <div id="tableContainer"></div>
                </div>

                <!-- AI 分析 -->
                <div class="panel" id="aiSection" style="display:none;">
                    <div class="panel-title">◈ AI 风险分析</div>
                    <div class="ai-result" id="aiContent" style="display:none;"></div>
                    <div id="aiLoading" style="display:none;" class="loading">◈ 分析中...</div>
                </div>
            </div>
        </div>

        <!-- ===== 风险挖掘 ===== -->
        <div class="feature-section active" id="feature-hot">
            <!-- 统计概览 -->
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:20px;">
                <div class="cyber-stat-card">
                    <div style="color:var(--cyber-primary);font-size:12px;text-transform:uppercase;letter-spacing:1px;">◈ 热门标的</div>
                    <div id="hotTotalCount" style="font-size:32px;font-weight:700;color:var(--cyber-text);margin-top:8px;">-</div>
                </div>
                <div class="cyber-stat-card">
                    <div style="color:var(--cyber-secondary);font-size:12px;text-transform:uppercase;letter-spacing:1px;">◈ 涨停标的</div>
                    <div id="hotZtCount" style="font-size:32px;font-weight:700;color:var(--cyber-secondary);margin-top:8px;">-</div>
                </div>
                <div class="cyber-stat-card">
                    <div style="color:var(--cyber-warning);font-size:12px;text-transform:uppercase;letter-spacing:1px;">◈ 高风险</div>
                    <div id="hotHighRiskCount" style="font-size:32px;font-weight:700;color:var(--cyber-danger);margin-top:8px;">-</div>
                </div>
                <div class="cyber-stat-card">
                    <div style="color:var(--cyber-success);font-size:12px;text-transform:uppercase;letter-spacing:1px;">◈ 中风险</div>
                    <div id="hotMediumRiskCount" style="font-size:32px;font-weight:700;color:var(--cyber-warning);margin-top:8px;">-</div>
                </div>
            </div>

            <!-- 工具栏 -->
            <div class="panel" style="margin-bottom:16px;">
                <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
                    <label style="color:var(--cyber-text-dim);font-size:12px;text-transform:uppercase;letter-spacing:1px;">◈ 日期</label>
                    <input type="date" id="hotDateInput" style="width:160px;">
                    <button class="cyber-btn" onclick="fetchHotStocks()">◈ 获取热门标的</button>
                    <label style="color:var(--cyber-text-dim);font-size:12px;margin-left:auto;">
                        数据来源: <span style="color:var(--cyber-primary);">涨停板 + 人气榜</span>
                    </label>
                </div>
            </div>

            <!-- 表格 -->
            <div class="panel">
                <div class="panel-title">◈ 热门关注列表</div>
                <div style="overflow-x:auto;">
                    <table class="stock-table">
                        <thead>
                            <tr>
                                <th style="text-align:center;width:40px;">#</th>
                                <th style="text-align:left;">代码</th>
                                <th style="text-align:left;">名称</th>
                                <th style="text-align:center;">来源</th>
                                <th style="text-align:center;">关注热度</th>
                                <th style="text-align:left;">行业</th>
                                <th style="text-align:center;">风险等级</th>
                                <th style="text-align:center;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="hotTableBody">
                            <tr>
                                <td colspan="8" style="text-align:center;padding:40px;color:var(--cyber-text-dim);">
                                    点击上方「获取热门标的」开始分析
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 详情面板 -->
            <div class="detail-panel" id="hotDetailPanel" style="display:none;margin-top:20px;">
                <div class="panel">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                        <h3 id="hotDetailHeader" style="color:var(--cyber-primary);">-</h3>
                        <span id="hotDetailRiskTag" class="tag">-</span>
                    </div>

                    <!-- 标签切换 -->
                    <div class="sub-tabs">
                        <button class="sub-tab active" onclick="switchSubTab('hot-detail', 'risk')">◈ 风险线索</button>
                        <button class="sub-tab" onclick="switchSubTab('hot-detail', 'main')">◈ 主营构成</button>
                        <button class="sub-tab" onclick="switchSubTab('hot-detail', 'ai')">◈ AI 分析</button>
                    </div>

                    <!-- 加载状态 -->
                    <div id="hotDetailLoading" class="loading">◈ 加载中...</div>

                    <!-- 风险线索 -->
                    <div id="hotDetailContent" style="display:none;">
                        <div style="background:rgba(0,0,0,0.3);border-radius:8px;padding:16px;margin-top:12px;">
                            <div id="hotLogicArea" style="font-size:13px;line-height:1.8;color:var(--cyber-text);white-space:pre-wrap;"></div>
                        </div>
                    </div>

                    <!-- 主营构成 -->
                    <div id="hotMainContent" style="display:none;">
                        <div style="background:rgba(0,0,0,0.3);border-radius:8px;padding:16px;margin-top:12px;">
                            <div id="hotZygcArea" style="font-size:13px;line-height:1.8;color:var(--cyber-text);white-space:pre-wrap;"></div>
                        </div>
                    </div>

                    <!-- AI 分析 -->
                    <div id="hotAiContent" style="display:none;">
                        <div class="ai-result" id="hotAnalysisArea" style="margin-top:12px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载遮罩 -->
    <div id="loadingOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9999;align-items:center;justify-content:center;">
        <div style="text-align:center;">
            <div class="loading-cyber" style="width:60px;height:60px;border:3px solid var(--cyber-border);border-top-color:var(--cyber-primary);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto;"></div>
            <div id="loadingText" style="color:var(--cyber-primary);margin-top:16px;font-size:14px;text-transform:uppercase;letter-spacing:2px;">◈ 处理中</div>
        </div>
    </div>

    <!-- 错误提示 -->
    <div id="errorMsg" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(255,51,102,0.9);color:#fff;padding:12px 24px;border-radius:4px;font-size:13px;z-index:9999;"></div>

    <script src="src/js/common.js"></script>
    <script src="src/js/finance.js"></script>
    <script src="src/js/hot.js"></script>
    <script src="src/js/macro.js"></script>
    <script>
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 设置默认日期为今天
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('hotDateInput').value = today;
        });
    </script>
</body>
</html>
